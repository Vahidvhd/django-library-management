{% extends 'base.html' %}

{% block title %}
Add Author
{% endblock%}



{% block content%}
<form method= "POST">
    {% csrf_token %}
    <label>First Name:</label>
    <input type="text" name='first_name'>

    <label>Last Name:</label>
    <input type="text" name='last_name'>

    <label>Age:</label>
    <input type="number" name='age'>
    <br>
    <button type='submit'>Save</button>



</form>
{% endblock %}
