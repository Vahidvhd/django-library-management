{% extends 'base.html' %}

{% block title %}
Add Author
{% endblock%}



{% block content%}
<div class="form-card">
    <form method="POST">
        {% csrf_token %}

        <div class="form-row">
            <label>First Name</label>
            <input type="text" name="first_name" placeholder="Author's first name">
        </div>
        <div class="form-row">
            <label>Last Name</label>
            <input type="text" name="last_name" placeholder="Author's last name">
        </div>

        <div class="form-row">
            <label>Age</label>
            <input type="number" name="age" placeholder="Author's age">
        </div>
        <button class="submit-btn" type="submit">Save</button>
    </form>

</div>
{% endblock %}
